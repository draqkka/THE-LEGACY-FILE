<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Correspondências · THE LEGACY FILE</title>
<style>
:root{--c:#191817;--b:#762B3C;--l:#C0A16A;--p:#E9DFCB;--serif:'Cormorant Garamond',Georgia,serif;--sans:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--c);color:var(--p);font:16px/1.5 Georgia,serif;min-height:100vh}
button{font:inherit;cursor:pointer}
.btn{background:none;border:1px solid var(--l);color:var(--l);padding:10px 18px;font:12px var(--sans);letter-spacing:.15em;text-transform:uppercase;transition:.25s}
.btn:hover{background:var(--l);color:#2a1b0c}.btn:disabled{opacity:.45;cursor:default}
#login{max-width:340px;margin:18vh auto 0;padding:24px;text-align:center}
#login h1{font:600 1.8rem var(--serif);letter-spacing:.12em;margin:0 0 6px;color:var(--l)}
#login p{opacity:.7;font-size:.95rem}
input[type=password],textarea{width:100%;background:#0006;border:1px solid #c0a16a77;color:var(--p);padding:11px 12px;font:1.05rem Georgia,serif;margin:10px 0}
textarea{resize:vertical;min-height:90px}
.erro{color:#e58a9b;min-height:1.4em;font-size:.95rem}
#app[hidden],#login[hidden]{display:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid #c0a16a44;background:#0004;position:sticky;top:0;z-index:20}
header h1{font:600 1.15rem var(--serif);letter-spacing:.14em;color:var(--l);margin:0}
.hd{display:flex;align-items:center;gap:14px}
#bell{position:relative;background:none;border:1px solid #c0a16a66;border-radius:50%;width:38px;height:38px;color:var(--l);display:grid;place-items:center;padding:0}
#bell:hover{background:#c0a16a22}
.bd{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#c0392b;color:#fff;font:700 11px var(--sans);display:grid;place-items:center;padding:0 5px}
.bd[hidden]{display:none}.bd.on{animation:pu 1.6s infinite}@keyframes pu{50%{box-shadow:0 0 0 6px #c0392b33}}
#ntf{position:absolute;top:60px;right:14px;width:min(380px,94vw);background:#f4ecdc;color:#2b211a;box-shadow:0 18px 44px #000c;z-index:30;border-radius:3px}
#ntf[hidden]{display:none}
#ntf .nh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #0002;font:700 15px var(--sans)}
#ntf .nh button{background:none;border:0;color:var(--b);font-size:1.2rem}
#ntf .nl{max-height:50vh;overflow:auto}
#ntf .ni{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #0001;padding:12px 16px;color:#2b211a}
#ntf .ni:hover{background:#762b3c14}
#ntf .ni small{display:block;opacity:.65;font:12px var(--sans);margin-top:4px}
#ntf .nv{padding:18px 16px;margin:0;opacity:.65;font-style:italic}
#ntf .nt{display:block;width:100%;padding:13px;border:0;border-top:1px solid #0002;background:none;color:var(--b);font:14px var(--sans)}
main{display:grid;grid-template-columns:290px 1fr;gap:0;min-height:calc(100vh - 64px)}
aside{border-right:1px solid #c0a16a33;padding:14px}
aside h2{font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--l);margin:4px 6px 12px}
.pf{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#0003;border:1px solid #c0a16a33;color:var(--p);padding:11px 12px;margin-bottom:8px;transition:.2s}
.pf:hover,.pf.on{border-color:var(--l);background:#c0a16a1c}
.pf .av{width:36px;height:36px;border-radius:50%;background:var(--b);display:grid;place-items:center;font:700 1.1rem var(--serif);flex:none}
.pf .tx{flex:1;min-width:0}.pf .tx b{display:block;font-weight:600}
.pf .tx small{display:block;opacity:.6;font:12px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf .n{background:#c0392b;color:#fff;border-radius:10px;font:700 11px var(--sans);padding:2px 7px}
section{padding:18px 22px;display:flex;flex-direction:column;min-width:0}
section h2{font:600 1.6rem var(--serif);margin:0 0 4px;color:var(--l)}
.vz{opacity:.6;font-style:italic}
#fio{flex:1;min-height:200px;max-height:58vh;overflow:auto;padding:6px 2px;display:flex;flex-direction:column;gap:12px}
.bl{max-width:82%;padding:12px 16px;border-radius:3px;background:#e9dfcb;color:#2b211a;box-shadow:0 6px 16px #0008}
.bl small{display:block;opacity:.65;font:11px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.bl p{margin:0;white-space:pre-wrap;word-wrap:break-word}
.bl.eu{align-self:flex-end;background:#762b3c;color:#f4ecdc}
.resp{margin-top:14px}
.ok{color:#8fd6a8;font-size:.95rem;min-height:1.4em}
@media(max-width:760px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #c0a16a33}.bl{max-width:94%}}
</style></head><body>

<div id="login">
  <h1>THE LEGACY FILE</h1>
  <p>Área da Rebeca · correspondências</p>
  <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" aria-label="Senha">
  <div class="erro" id="lerro" aria-live="polite"></div>
  <button class="btn" id="entrar">Entrar</button>
</div>

<div id="app" hidden>
  <header>
    <h1>CORRESPONDÊNCIAS</h1>
    <div class="hd">
      <button id="bell" aria-label="Notificações" title="Notificações">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="bd" id="bd" hidden>0</span>
      </button>
      <button class="btn" id="sair">Sair</button>
    </div>
  </header>
  <div id="ntf" hidden role="dialog" aria-label="Notificações"></div>
  <main>
    <aside><h2>Professores</h2><div id="lista"></div></aside>
    <section>
      <h2 id="tit">Escolha um professor</h2>
      <p class="vz" id="sub">As correspondências recebidas aparecem aqui.</p>
      <div id="fio"></div>
      <div class="resp" id="resp" hidden>
        <textarea id="txt" maxlength="2000" placeholder="Escreva a sua resposta..." aria-label="Sua resposta"></textarea>
        <button class="btn" id="env">Responder</button> <span class="ok" id="ok" aria-live="polite"></span>
      </div>
    </section>
  </main>
</div>

<script src="/js/data.js"></script>
<script>
const $=s=>document.querySelector(s);
const NOMES=(window.LF&&LF.professores&&LF.professores.map(p=>p.nome))||['Professora Cássia','Professor Julio','Professora Vanessa','Professor José'];
let senha=sessionStorage.getItem('lf.admin')||'',atual=null,R={resumo:[],novas:[],naoLidas:0},timer=null;
const ago=iso=>{const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));return m<1?'agora há pouco':m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:`há ${Math.round(m/1440)} d`};
const quando=iso=>new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
async function api(m,q,body){
  const r=await fetch('/api/admin'+(q||''),{method:m,headers:{'Content-Type':'application/json','x-admin-senha':senha},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  return {status:r.status,j};
}
async function entrar(){
  senha=$('#senha').value||senha;$('#lerro').textContent='';
  const {status,j}=await api('GET');
  if(status===503){$('#lerro').textContent='A senha ainda não foi criada na Vercel (variável ADMIN_SENHA).';return}
  if(status===401){$('#lerro').textContent='Senha incorreta.';return}
  if(!j.ok){$('#lerro').textContent='Não foi possível conectar ao banco agora.';return}
  sessionStorage.setItem('lf.admin',senha);
  $('#login').hidden=true;$('#app').hidden=false;aplica(j);
  clearInterval(timer);timer=setInterval(atualiza,20000);
}
function aplica(j){R=j;
  const n=j.naoLidas||0,b=$('#bd');b.hidden=!n;b.textContent=n>9?'9+':n;b.classList.toggle('on',n>0);
  document.title=(n?`(${n}) `:'')+'Correspondências · THE LEGACY FILE';
  const L=$('#lista');L.innerHTML='';
  NOMES.forEach((nome,i)=>{const r=(j.resumo||[]).find(x=>x.prof===i)||{total:0,nao_lidas:0};
    const b=el('button','pf'+(atual===i?' on':''));b.append(el('span','av',nome.split(' ').pop()[0]));
    const tx=el('span','tx');tx.append(el('b','',nome),el('small','',r.total?`${r.total} mensagem(ns)${r.ultima?' · '+ago(r.ultima):''}`:'Nenhuma ainda'));b.append(tx);
    if(r.nao_lidas)b.append(el('span','n',r.nao_lidas));
    b.onclick=()=>abrir(i);L.append(b)});
  const N=$('#ntf');N.innerHTML='';
  const h=el('div','nh');h.append(el('b','','Notificações'));const ck=el('button','','✓');ck.title='Marcar todas como lidas';
  ck.onclick=async()=>{for(const p of new Set((R.novas||[]).map(x=>x.prof)))await api('POST','',{acao:'lido',prof:p});N.hidden=true;atualiza()};h.append(ck);N.append(h);
  const l=el('div','nl');
  if(!(j.novas||[]).length)l.append(el('p','nv','Nenhuma notificação nova.'));
  (j.novas||[]).forEach(x=>{const it=el('button','ni');const t=x.texto.length>90?x.texto.slice(0,90)+'…':x.texto;
    it.append(el('b','',(NOMES[x.prof]||'Professor')+' enviou uma correspondência'),el('br'),document.createTextNode(t),el('small','',ago(x.criado_em)));
    it.onclick=()=>{N.hidden=true;abrir(x.prof)};l.append(it)});
  N.append(l);const t=el('button','nt','Mostrar todos');t.onclick=()=>{N.hidden=true;document.getElementById('lista').scrollIntoView({behavior:'smooth'})};N.append(t);
}
async function abrir(i){atual=i;$('#tit').textContent=NOMES[i];$('#sub').textContent='Conversa com este professor.';$('#resp').hidden=false;await conversa(true)}
async function conversa(marca){
  if(atual==null)return;const {j}=await api('GET','?prof='+atual);if(!j.ok)return;
  const f=$('#fio'),fim=f.scrollTop+f.clientHeight>=f.scrollHeight-40;f.innerHTML='';
  if(!j.itens.length)f.append(el('p','vz','Este professor ainda não enviou nenhuma correspondência.'));
  j.itens.forEach(m=>{const d=el('div','bl'+(m.de==='admin'?' eu':''));d.append(el('small','',(m.de==='admin'?'Você (Rebeca)':NOMES[atual])+' · '+quando(m.criado_em)),el('p','',m.texto));f.append(d)});
  if(marca||fim)f.scrollTop=f.scrollHeight;
  if(j.itens.some(m=>m.de==='prof'&&!m.lida)){await api('POST','',{acao:'lido',prof:atual});atualiza()}
}
async function atualiza(){const {status,j}=await api('GET');if(status===401){sair();return}if(j.ok){aplica(j);conversa(false)}}
async function responde(){
  const t=$('#txt').value.trim();if(!t||atual==null)return;const b=$('#env');b.disabled=true;$('#ok').textContent='';
  const {j}=await api('POST','',{acao:'responder',prof:atual,texto:t});b.disabled=false;
  if(!j.ok){$('#ok').style.color='#e58a9b';$('#ok').textContent='Não foi possível enviar.';return}
  $('#ok').style.color='';$('#ok').textContent='Resposta enviada.';$('#txt').value='';await conversa(true);atualiza();setTimeout(()=>$('#ok').textContent='',3000);
}
function sair(){sessionStorage.removeItem('lf.admin');senha='';clearInterval(timer);$('#app').hidden=true;$('#login').hidden=false;$('#senha').value=''}
$('#entrar').onclick=entrar;$('#senha').onkeydown=e=>{if(e.key==='Enter')entrar()};
$('#sair').onclick=sair;$('#env').onclick=responde;$('#txt').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))responde()};
$('#bell').onclick=e=>{e.stopPropagation();const n=$('#ntf');n.hidden=!n.hidden};
document.addEventListener('click',e=>{const n=$('#ntf');if(!n.hidden&&!n.contains(e.target))n.hidden=true});
if(senha)entrar();
</script></body></html>
